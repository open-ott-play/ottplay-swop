name: 'Auto Approve PRs'
description: 'Auto-approve Dependabot, Renovate, and 4alvit PRs'
"on":
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
jobs:
  auto-approve:
    name: Auto Approve
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/auto-approve-reusable.yml@90fae60a049bbd1a55ac218c379f36cb101299f1
    secrets:
      BOT_PAT: ${{ secrets.BOT_PAT }}
