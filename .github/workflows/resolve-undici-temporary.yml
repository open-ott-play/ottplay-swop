name: Temporary Undici lock resolution
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  resolve:
    if: github.event.pull_request.number == 94 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Resolve the security override without lifecycle scripts
        run: |
          npm pkg set 'overrides.undici=7.30.1'
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm view undici@7.30.1 version dist engines --json > undici-metadata.json
          node --version > resolver-versions.txt
          npm --version >> resolver-versions.txt
      - name: Record the resolved dependency audit
        continue-on-error: true
        run: npm audit --package-lock-only --json > dependency-audit.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: undici-7.30.1-resolved-lock
          if-no-files-found: error
          retention-days: 3
          path: |
            package.json
            package-lock.json
            undici-metadata.json
            resolver-versions.txt
            dependency-audit.json
