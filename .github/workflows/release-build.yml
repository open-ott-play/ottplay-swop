name: Build release assets
'on':
  workflow_call:
    inputs:
      version:
        description: Committed base version, without a v prefix or channel suffix
        required: true
        type: string
      channel:
        description: nightly, beta or rc; stable promotes existing RC bytes
        required: true
        type: string
      release_plan_artifact:
        description: Frozen version plan artifact allocated by the release workflow
        required: true
        type: string
permissions:
  contents: read
env:
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_CHANNEL: ${{ inputs.channel }}
defaults:
  run:
    shell: bash
jobs:
  worker:
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && (vars.CI_RUNNER_RELEASE_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up release version tooling
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Download frozen release version plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ inputs.release_plan_artifact }}
          path: .
      - name: Apply frozen release version inputs
        shell: bash
        run: python3 scripts/version_plan.py sync --root . --plan .release-plan.json
      - name: Verify committed release version
        run: python3 scripts/check-release-version.py "$RELEASE_VERSION" "$RELEASE_CHANNEL"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: bash scripts/release-build.sh "$RELEASE_VERSION" "$RELEASE_CHANNEL"
      - name: Verify and stage versioned release assets
        shell: bash
        env:
          RELEASE_ASSET_TARGET: worker
          RELEASE_ASSET_PATTERN_0: release-output/ottplay-swop-worker.tar.gz
        run: python3 scripts/stage_release_assets.py --target "$RELEASE_ASSET_TARGET" --pattern "$RELEASE_ASSET_PATTERN_0"
      - name: Store release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-assets-worker
          path: release-assets/worker/*
          if-no-files-found: error
          retention-days: 14
